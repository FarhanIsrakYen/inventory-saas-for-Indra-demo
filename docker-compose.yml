services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stockpilot:stockpilot_dev@postgres:5432/stockpilot?sslmode=disable}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
      PATHAO_BASE_URL: ${PATHAO_BASE_URL:-https://courier-api-sandbox.pathao.com}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID:-}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET:-}
      PATHAO_USERNAME: ${PATHAO_USERNAME:-}
      PATHAO_PASSWORD: ${PATHAO_PASSWORD:-}
      PATHAO_STORE_ID: ${PATHAO_STORE_ID:-0}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-32-chars}
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  es_data:
